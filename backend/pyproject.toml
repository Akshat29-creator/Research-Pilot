[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot-backend"
version = "0.1.0"
description = "FastAPI backend and multi-agent engine for ResearchPilot AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ResearchPilot AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "bcrypt>=4.0.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["B008", "UP006", "UP035"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
