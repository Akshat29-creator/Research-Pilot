global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "researchpilot-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000", "backend:8000"]
        labels:
          environment: "local"
          service: "researchpilot"
